<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip Wallet prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--out:#E4ECEA;--bg:#F3F7F5;--card:#fff;--ink:#10282C;--mut:#586E73;--line:#D4E0DD;--brand:#0E5560;--onbrand:#fff;--accent:#E8911A;--ok:#1B7A4A;--err:#B3261E;--chip:#E1EFEC;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--out:#071012;--bg:#0C1A1D;--card:#13262A;--ink:#E6F0EE;--mut:#93AAAE;--line:#25403F;--brand:#5CC2CF;--onbrand:#06262B;--accent:#F2B25A;--ok:#6FD39B;--err:#FF8A80;--chip:#1B3438}}
:root[data-theme="dark"]{--out:#071012;--bg:#0C1A1D;--card:#13262A;--ink:#E6F0EE;--mut:#93AAAE;--line:#25403F;--brand:#5CC2CF;--onbrand:#06262B;--accent:#F2B25A;--ok:#6FD39B;--err:#FF8A80;--chip:#1B3438}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--out);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);padding:0 18px 48px}
h1,h2,.brand,.big,.num{font-family:"Bricolage Grotesque",system-ui,sans-serif}
h1{font-size:30px;line-height:1.1;letter-spacing:-.02em;margin:8px 0 4px}
h2{font-size:20px;margin:24px 0 8px}
.top{display:flex;align-items:center;min-height:56px}
.brand{font-weight:700;font-size:20px;color:var(--brand)}
.back{background:none;border:0;color:var(--brand);font:600 16px system-ui;padding:10px 10px 10px 0;cursor:pointer}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:600 16px system-ui;background:var(--brand);color:var(--onbrand);cursor:pointer;margin-top:14px}
.btn.sec{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.sm{border:1.5px solid var(--brand);background:transparent;color:var(--brand);border-radius:10px;padding:8px 12px;font:600 14px system-ui;cursor:pointer;white-space:nowrap}
.lnk{background:none;border:0;color:var(--brand);font:600 14px system-ui;padding:4px 0 4px 14px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label{display:block;font-weight:600;font-size:14px;margin:18px 0 6px}
input,select{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
.amt{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);padding:4px 14px}
.amt span{font-size:30px;font-weight:700;color:var(--mut)}
.amt input{border:0;font-size:32px;font-weight:700;padding:8px 0;background:transparent}
.addrow{display:flex;gap:8px}
.addrow input{flex:1}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{background:var(--chip);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.pill button{background:none;border:0;color:var(--mut);font-size:16px;cursor:pointer;padding:0 0 0 6px}
.err{color:var(--err);font-size:14px;margin-top:6px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.chip{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;margin:8px 0 0;cursor:pointer;text-align:left}
.chip.on{border-color:var(--brand);background:var(--chip)}
.tick{display:inline-block;width:20px;height:20px;border:1.5px solid var(--mut);border-radius:6px;margin-right:10px;vertical-align:-4px;text-align:center;line-height:17px;font-style:normal;font-size:14px}
.chip.on .tick{background:var(--brand);border-color:var(--brand);color:var(--onbrand)}
.chip.on .tick::after{content:"✓"}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.num{font-weight:700}
.ok{color:var(--ok)}.bad{color:var(--err)}
.hero{font-size:34px;font-weight:700;line-height:1.1;margin:4px 0}
.banner{background:var(--chip);border-radius:12px;padding:12px 14px;font-weight:600;margin:12px 0}
.tools{margin-top:32px;font-size:13px;color:var(--mut)}
.tools button{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;font:inherit;padding:0 10px 0 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
var S={trips:[],cur:0,view:'home',d:null,dt:null,e:{}};
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(p){return '₹'+(p/100).toLocaleString('en-IN',{minimumFractionDigits:p%100?2:0,maximumFractionDigits:2})}
function T(){return S.trips[S.cur]}
function split(total,sel,payer){var n=sel.length,base=Math.floor(total/n),o={};sel.forEach(function(m){o[m]=base});o[sel.indexOf(payer)>-1?payer:sel[0]]+=total-base*n;return o}
function nets(t){var n={};t.members.forEach(function(m){n[m]=0});t.exp.forEach(function(e){n[e.payer]+=e.total;for(var m in e.shares)n[m]-=e.shares[m]});return n}
function plan(t){var n=nets(t),cr=[],db=[],out=[],i=0,j=0,m;for(m in n){if(n[m]>0)cr.push([m,n[m]]);else if(n[m]<0)db.push([m,-n[m]])}
cr.sort(function(a,b){return b[1]-a[1]});db.sort(function(a,b){return b[1]-a[1]});
while(i<db.length&&j<cr.length){var x=Math.min(db[i][1],cr[j][1]);out.push({from:db[i][0],to:cr[j][0],amt:x});db[i][1]-=x;cr[j][1]-=x;if(!db[i][1])i++;if(!cr[j][1])j++}return out}
function render(){$('app').innerHTML=({home:home,create:create,trip:trip,add:add,settle:settle})[S.view]();if(S.view==='add')refreshAdd()}
function go(v){S.view=v;S.e={};if(v==='create')S.dt={name:'',f:[]};render();window.scrollTo(0,0)}
function hdr(back){return '<div class="top">'+(back?'<button class="back" onclick="go(\''+back+'\')">‹ Back</button>':'<span class="brand">Trip Wallet</span>')+'</div>'}

function home(){
var h=hdr()+'<h1>Your trips</h1><p class="mut">Log shared costs as you go. Settle up when the trip ends.</p>';
if(!S.trips.length)h+='<div class="card"><b>No trips yet</b><p class="mut" style="margin:6px 0 0">Create a trip, add your friends, then log what everyone spends.</p></div>';
S.trips.forEach(function(t,i){var tot=t.exp.reduce(function(a,e){return a+e.total},0);h+='<button class="chip" style="padding:16px" onclick="S.cur='+i+';go(\'trip\')"><span><b>'+esc(t.name)+'</b><br><span class="mut">'+t.members.length+' people, '+t.exp.length+' expenses</span></span><b class="num">'+fmt(tot)+'</b></button>'});
h+='<button class="btn" onclick="go(\'create\')">Create a trip</button>';
h+='<div class="tools">Facilitator: <button onclick="sample()">Load sample Goa trip</button><button onclick="S={trips:[],cur:0,view:\'home\',d:null,dt:null,e:{}};render()">Reset</button></div>';
return h}

function create(){var d=S.dt;
return hdr('home')+'<h1>Create a trip</h1>'+
'<label for="tn">Trip name</label><input id="tn" value="'+esc(d.name)+'" placeholder="Goa trip" oninput="S.dt.name=this.value">'+(S.e.name?'<div class="err">'+S.e.name+'</div>':'')+
'<label for="fi">Add friends</label><div class="addrow"><input id="fi" placeholder="Friend’s name" onkeydown="if(event.key===\'Enter\')addF()"><button class="sm" onclick="addF()">Add</button></div>'+
'<div class="pills"><span class="pill">You</span>'+d.f.map(function(f,i){return '<span class="pill">'+esc(f)+'<button aria-label="Remove '+esc(f)+'" onclick="rmF('+i+')">×</button></span>'}).join('')+'</div>'+
(S.e.f?'<div class="err">'+S.e.f+'</div>':'')+
'<button class="btn" onclick="mk()">Create trip</button>'}
function addF(){var v=$('fi').value.trim();if(v&&v.toLowerCase()!=='you'&&S.dt.f.indexOf(v)<0)S.dt.f.push(v);S.e.f='';render();$('fi').focus()}
function rmF(i){S.dt.f.splice(i,1);render()}
function mk(){var d=S.dt;S.e={};if(!d.name.trim())S.e.name='Give your trip a name.';if(!d.f.length)S.e.f='Add at least one friend to share costs with.';
if(S.e.name||S.e.f){render();return}
S.trips.unshift({name:d.name.trim(),members:['You'].concat(d.f),exp:[],st:{}});S.cur=0;go('trip')}

function trip(){var t=T(),n=nets(t)['You'],tot=t.exp.reduce(function(a,e){return a+e.total},0);
var bal=n>0?'<div class="hero ok">You are owed '+fmt(n)+'</div>':n<0?'<div class="hero bad">You owe '+fmt(-n)+'</div>':'<div class="hero">You are all square</div>';
var h=hdr('home')+'<h1>'+esc(t.name)+'</h1><p class="mut">With '+t.members.slice(1).map(esc).join(', ')+'</p>'+
'<div class="card"><span class="mut">Your balance</span>'+bal+'<span class="mut">Trip total '+fmt(tot)+'</span></div>'+
'<button class="btn" onclick="openAdd()">Add expense</button><button class="btn sec" onclick="go(\'settle\')">Settle up</button><h2>Expenses</h2>';
if(!t.exp.length)h+='<div class="card mut">No expenses yet. Add the first one to start tracking who owes what.</div>';
else{h+='<div class="card" style="padding:4px 16px">';t.exp.slice().reverse().forEach(function(e){h+='<div class="row"><div><b>'+esc(e.desc)+'</b><br><span class="mut">Paid by '+esc(e.payer)+', split between '+Object.keys(e.shares).length+'</span></div><b class="num">'+fmt(e.total)+'</b></div>'});h+='</div>'}
return h}

function openAdd(){S.d={desc:'',amt:'',payer:'You',sel:T().members.slice()};go('add')}
function add(){var d=S.d,m=T().members;
return hdr('trip')+'<h1>Add expense</h1>'+
'<label for="am">Amount</label><div class="amt"><span>₹</span><input id="am" inputmode="decimal" placeholder="0" value="'+esc(d.amt)+'" oninput="S.d.amt=this.value;refreshAdd()"></div>'+
'<label for="ds">What was it for?</label><input id="ds" value="'+esc(d.desc)+'" placeholder="Dinner" oninput="S.d.desc=this.value">'+
'<label for="pb">Paid by</label><select id="pb" onchange="S.d.payer=this.value;refreshAdd()">'+m.map(function(x){return '<option'+(x===d.payer?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select>'+
'<div class="hd"><b style="font-size:14px">Split between</b><span><button class="lnk" onclick="selAll(true)">Select all</button><button class="lnk" onclick="selAll(false)">Clear</button></span></div>'+
m.map(function(x,i){return '<button class="chip" id="c'+i+'" aria-pressed="false" onclick="tg('+i+')"><span><i class="tick"></i>'+esc(x)+'</span><b class="num" id="s'+i+'"></b></button>'}).join('')+
'<p id="hint" class="mut" style="margin:12px 0 0"></p><button class="btn" id="sv" onclick="saveE()">Save expense</button>'}
function tg(i){var x=T().members[i],k=S.d.sel.indexOf(x);if(k<0)S.d.sel.push(x);else S.d.sel.splice(k,1);refreshAdd()}
function selAll(on){S.d.sel=on?T().members.slice():[];refreshAdd()}
function calc(){var d=S.d,m=T().members,tot=Math.round(parseFloat(d.amt)*100)||0,sel=m.filter(function(x){return d.sel.indexOf(x)>-1});
return{m:m,tot:tot,sel:sel,sh:tot>0&&sel.length?split(tot,sel,d.payer):{}}}
function refreshAdd(){var c=calc();
c.m.forEach(function(x,i){var on=c.sel.indexOf(x)>-1,el=$('c'+i);el.classList.toggle('on',on);el.setAttribute('aria-pressed',on);$('s'+i).textContent=on?(c.tot>0?fmt(c.sh[x]):''):'Not included'});
var ok=c.tot>0&&c.sel.length>0,h=$('hint');
h.className=ok?'mut':'err';h.style.margin='12px 0 0';
h.textContent=c.tot<=0?'Enter an amount to see each share.':!c.sel.length?'Select at least one person to split with. ₹0 assigned of '+fmt(c.tot)+'.':'Split equally between '+c.sel.length+(c.sel.length>1?' people':' person')+'. Total '+fmt(c.tot)+'.';
$('sv').disabled=!ok}
function saveE(){var c=calc();if(!(c.tot>0&&c.sel.length))return;T().exp.push({desc:S.d.desc.trim()||'Expense',total:c.tot,payer:S.d.payer,shares:c.sh});go('trip')}

function settle(){var t=T(),n=nets(t),p=plan(t),h=hdr('trip')+'<h1>Settle up</h1><p class="mut">'+esc(t.name)+'</p><h2>Balances</h2><div class="card" style="padding:4px 16px">';
t.members.forEach(function(m){var v=n[m],w=m==='You'?['You are','You owe']:[m+' is',m+' owes'];
h+='<div class="row"><span>'+esc(m)+'</span>'+(v>0?'<b class="ok">'+(m==='You'?'You are':esc(m)+' is')+' owed '+fmt(v)+'</b>':v<0?'<b class="bad">'+(m==='You'?'You owe ':esc(m)+' owes ')+fmt(-v)+'</b>':'<span class="mut">Settled up</span>')+'</div>'});
h+='</div><h2>Payments to settle</h2>';
if(!p.length)h+='<div class="card mut">Nothing to settle yet. Add expenses first.</div>';
else{h+='<div class="card" style="padding:4px 16px">';p.forEach(function(x,i){var k=x.from+'>'+x.to,s=t.st[k],act='';
if(s==='paid')act='<span class="ok"><b>✓ Paid</b></span>';
else if(x.to==='You')act=s==='req'?'<span class="mut">Requested</span> <button class="sm" onclick="setSt('+i+',\'paid\')">Mark paid</button>':'<button class="sm" onclick="setSt('+i+',\'req\')">Request payment</button>';
else if(x.from==='You')act='<button class="sm" onclick="setSt('+i+',\'paid\')">Mark as paid</button>';
else act='<span class="mut">Between friends</span>';
h+='<div class="row"><div><b>'+(x.from==='You'?'You pay ':esc(x.from)+' pays ')+(x.to==='You'?'you':esc(x.to))+'</b><br><b class="num">'+fmt(x.amt)+'</b></div><div style="text-align:right">'+act+'</div></div>'});h+='</div>';
if(p.every(function(x){return t.st[x.from+'>'+x.to]==='paid'}))h+='<div class="banner">Everyone is settled. Nice trip!</div>'}
return h}
function setSt(i,v){var x=plan(T())[i];T().st[x.from+'>'+x.to]=v;render()}

function sample(){var m=['You','Arjun','Kabir','Meera','Neha'];
function e(d,tot,p,sel){return{desc:d,total:tot*100,payer:p,shares:split(tot*100,sel,p)}}
S.trips.unshift({name:'Goa trip',members:m,st:{},exp:[e('Beach hotel',12000,'You',m),e('Scooter rental',3000,'Arjun',['You','Arjun','Kabir']),e('Shack lunch',3600,'Kabir',['You','Arjun','Kabir','Meera']),e('Airport cab',2500,'Meera',m)]});
S.cur=0;go('trip')}
render();
</script>
</body>
</html>
